name: Supabase 동기화

# Supabase가 사전의 원천이지만, git은 폐기가 아니라 강등된 것이다.
#   · 회귀 테스트(test_sync.py / matcher.test.js)의 골든 데이터가 data/dist/다
#   · Supabase가 정지·삭제돼도 사전을 복구할 수 있는 완전한 사본이다
#   · demo 페이지의 최후 폴백(/data/dist/wine_terms.json)이다
# 이 동기화가 멈추면 CI는 낡은 데이터로 통과하는데 실서비스는 최신을 쓰는
# 괴리가 생긴다. 그래서 실패는 조용히 넘어가지 않고 이슈를 연다.
#
# 필요한 저장소 secret: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# 필요한 설정: Settings -> Actions -> Workflow permissions -> Read and write

on:
  # 쓰기 함수가 편집 직후 쏘는 신호 (즉시성)
  repository_dispatch:
    types: [dict-updated]
  # 매일 03:17 KST. 유실된 dispatch를 잡는 정합성 검사 겸, 무료 티어
  # 7일 무활동 일시정지를 막는 keepalive 역할도 한다.
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

# 연속 편집을 한 커밋으로 합친다 — 즉시성을 포기하지 않으면서 커밋 소음을 막는다.
concurrency:
  group: dict-export
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Supabase -> data/seed/
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_from_supabase.py

      - name: seed -> data/dist/ 재생성
        run: python scripts/build.py

      # 테스트가 빨간불이면 커밋하지 않는다. 낡은 dist를 남기는 편이
      # 깨진 dist를 커밋해 골든 데이터를 오염시키는 것보다 낫다.
      - name: 회귀 테스트
        run: npm test

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed data/dist
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          # [skip ci]로 Vercel 재배포를 막는다. 페이지가 사전을 fetch하므로
          # 데이터 변경에 재배포가 필요 없고, Hobby 플랜의 일일 배포 한도만 축낸다.
          git commit -m "chore(data): Supabase 동기화 [skip ci]"
          git push

      - name: 실패 시 이슈 생성
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Supabase 동기화 실패 ($(date -u +%Y-%m-%d))" \
            --body "git의 data/seed·data/dist가 Supabase와 어긋난 채로 남아 있습니다.

          회귀 테스트의 골든 데이터가 낡으면 CI는 통과하는데 실서비스와 괴리됩니다.
          실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "이슈 생성 실패(권한 확인 필요) — 로그로만 남깁니다."
