<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7a1f2b">
<link rel="manifest" href="/demo/manifest.webmanifest">
<title>와인명 사전</title>
<style>
  :root{
    --ink:#1c1917;
    --bg:#edefea;
    --surface:#fbfcfa;
    --surface-2:#f2f4ee;
    --muted:#6b7268;
    --garnet:#7a1f2b;
    --garnet-ink:#ffffff;
    --line:rgba(28,25,23,0.13);
    --line-strong:rgba(28,25,23,0.22);
    --score-hi:#3f6b4c;
    --score-hi-bg:rgba(63,107,76,0.12);
    --score-md:#9c6b18;
    --score-md-bg:rgba(156,107,24,0.12);
    --score-lo:#8b5e62;
    --score-lo-bg:rgba(139,94,98,0.12);
    --cat-p:#7a1f2b;
    --cat-p-bg:rgba(122,31,43,0.09);
    --cat-r:#3e5c76;
    --cat-r-bg:rgba(62,92,118,0.1);
    --cat-g:#5f6e30;
    --cat-g-bg:rgba(95,110,48,0.1);
    --serif:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#ece7dd;
      --bg:#14120f;
      --surface:#1c1a16;
      --surface-2:#211e19;
      --muted:#a39c8e;
      --garnet:#e08893;
      --garnet-ink:#1c1917;
      --line:rgba(236,231,221,0.14);
      --line-strong:rgba(236,231,221,0.24);
      --score-hi:#8bcb9c;
      --score-hi-bg:rgba(139,203,156,0.14);
      --score-md:#e0b25f;
      --score-md-bg:rgba(224,178,95,0.14);
      --score-lo:#cf9ba0;
      --score-lo-bg:rgba(207,155,160,0.14);
      --cat-p:#e08893;
      --cat-p-bg:rgba(224,136,147,0.14);
      --cat-r:#8fb0d4;
      --cat-r-bg:rgba(143,176,212,0.14);
      --cat-g:#b7c67c;
      --cat-g-bg:rgba(183,198,124,0.14);
    }
  }
  :root[data-theme="dark"]{
    --ink:#ece7dd;
    --bg:#14120f;
    --surface:#1c1a16;
    --surface-2:#211e19;
    --muted:#a39c8e;
    --garnet:#e08893;
    --garnet-ink:#1c1917;
    --line:rgba(236,231,221,0.14);
    --line-strong:rgba(236,231,221,0.24);
    --score-hi:#8bcb9c;
    --score-hi-bg:rgba(139,203,156,0.14);
    --score-md:#e0b25f;
    --score-md-bg:rgba(224,178,95,0.14);
    --score-lo:#cf9ba0;
    --score-lo-bg:rgba(207,155,160,0.14);
    --cat-p:#e08893;
    --cat-p-bg:rgba(224,136,147,0.14);
    --cat-r:#8fb0d4;
    --cat-r-bg:rgba(143,176,212,0.14);
    --cat-g:#b7c67c;
    --cat-g-bg:rgba(183,198,124,0.14);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
  }
  .page{
    max-width:700px;
    margin:0 auto;
    padding:56px 24px 96px;
  }
  .masthead{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:36px;
    padding-right:44px;
  }
  .eyebrow{
    margin:0;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--garnet);
  }
  h1{
    margin:0;
    font-family:var(--serif);
    font-weight:600;
    font-size:clamp(30px,5vw,40px);
    letter-spacing:-0.01em;
    text-wrap:balance;
  }
  .lede{
    margin:0;
    max-width:52ch;
    color:var(--muted);
    font-size:15px;
  }
  .stat{
    margin:4px 0 0;
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    letter-spacing:0.01em;
  }
  .search-panel{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line-strong);
    margin-bottom:20px;
  }
  #q{
    width:100%;
    padding:16px 18px;
    font-family:var(--serif);
    font-style:italic;
    font-size:19px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:3px;
    outline:none;
  }
  #q::placeholder{color:var(--muted);opacity:0.85}
  #q:focus-visible{
    border-color:var(--garnet);
    box-shadow:0 0 0 3px var(--score-hi-bg,rgba(122,31,43,0.14));
  }
  .controls-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .chips{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .chip{
    font-family:var(--sans);
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.02em;
    padding:7px 13px;
    border-radius:100px;
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .chip:focus-visible{outline:2px solid var(--garnet);outline-offset:2px}
  .chip.on{
    background:var(--garnet);
    border-color:var(--garnet);
    color:var(--garnet-ink);
  }
  .precision{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-size:12.5px;
  }
  .precision-label{
    letter-spacing:0.02em;
    white-space:nowrap;
  }
  .precision-value{
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    min-width:3.2ch;
  }
  #th{accent-color:var(--garnet);width:110px}
  .jamo{
    display:none;
    flex-direction:column;
    gap:6px;
    margin-bottom:20px;
    padding:14px 16px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:4px;
    font-size:13px;
  }
  .jamo.on{display:flex}
  .jamo-row{display:flex;gap:10px;align-items:baseline}
  .jamo-label{
    flex:0 0 74px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .jamo-value{color:var(--ink);word-break:break-all}
  .jamo-value.mono{font-variant-numeric:tabular-nums;letter-spacing:0.02em}
  .jamo-value em{
    font-style:normal;
    color:var(--garnet);
    text-decoration:underline;
    text-decoration-color:var(--score-lo-bg);
    text-decoration-thickness:2px;
  }
  .results{display:flex;flex-direction:column}
  .hit{
    display:grid;
    grid-template-columns:56px 1fr auto;
    gap:16px;
    align-items:center;
    padding:16px 4px;
    border-bottom:1px solid var(--line);
    animation:rise 0.22s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.hit{animation:none}}
  .score{
    font-variant-numeric:tabular-nums;
    font-size:14px;
    font-weight:700;
    text-align:center;
    padding:7px 0;
    border-radius:4px;
  }
  .s-hi{color:var(--score-hi);background:var(--score-hi-bg)}
  .s-md{color:var(--score-md);background:var(--score-md-bg)}
  .s-lo{color:var(--score-lo);background:var(--score-lo-bg)}
  .body-en{
    font-family:var(--serif);
    font-style:italic;
    font-size:17px;
    line-height:1.3;
  }
  .body-ko{
    margin-top:2px;
    font-size:13.5px;
    color:var(--muted);
  }
  .via{color:var(--muted)}
  .via b{color:var(--ink);font-weight:600;font-style:normal}
  .meta{
    display:flex;
    justify-content:flex-end;
  }
  .tag{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    padding:4px 9px;
    border-radius:100px;
    white-space:nowrap;
  }
  .t-p{color:var(--cat-p);background:var(--cat-p-bg)}
  .t-r{color:var(--cat-r);background:var(--cat-r-bg)}
  .t-g{color:var(--cat-g);background:var(--cat-g-bg)}
  .empty{
    padding:40px 4px;
    color:var(--muted);
    font-size:14px;
    max-width:44ch;
  }
  .empty b{color:var(--ink)}
  .hint{
    padding:40px 4px;
    color:var(--muted);
    font-size:13px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .hint-examples{display:flex;flex-wrap:wrap;gap:8px}
  .hint-chip{
    font-family:var(--serif);
    font-style:italic;
    font-size:13.5px;
    padding:6px 12px;
    border:1px solid var(--line-strong);
    border-radius:100px;
    background:none;
    color:var(--ink);
    cursor:pointer;
  }
  .hint-chip:hover{border-color:var(--garnet);color:var(--garnet)}
  .hint-chip:focus-visible{outline:2px solid var(--garnet);outline-offset:2px}
  @media (max-width:520px){
    .page{padding:40px 18px 72px}
    .hit{grid-template-columns:44px 1fr auto;gap:12px}
    .body-en{font-size:15.5px}
    .controls-row{align-items:flex-start}
  }

  /* ── 사전 관리 패널 ─────────────────────────────────────────── */
  .icon-btn{
    position:absolute;
    top:0;
    right:0;
    width:36px;
    height:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid var(--line-strong);
    border-radius:50%;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .icon-btn svg{width:18px;height:18px;stroke:currentColor}
  .icon-btn:hover{border-color:var(--garnet);color:var(--garnet)}
  .icon-btn:focus-visible{outline:2px solid var(--garnet);outline-offset:2px}
  .admin-modal{
    width:min(880px,92vw);
    max-height:86vh;
    padding:0;
    border:none;
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    box-shadow:0 20px 60px rgba(0,0,0,0.28);
  }
  .admin-modal::backdrop{background:rgba(0,0,0,0.45)}
  .admin-inner{display:flex;flex-direction:column;max-height:86vh}
  .admin-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px 22px;
    border-bottom:1px solid var(--line-strong);
    flex:0 0 auto;
  }
  .admin-head h2{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
  .admin-head .icon-btn{position:static}
  .admin-body{padding:18px 22px;overflow-y:auto}
  .admin-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .admin-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .admin-search{
    flex:1 1 200px;
    padding:9px 12px;
    font-family:var(--sans);
    font-size:13.5px;
    color:var(--ink);
    background:var(--surface-2);
    border:1px solid var(--line-strong);
    border-radius:4px;
    outline:none;
  }
  .admin-search:focus-visible{border-color:var(--garnet)}
  .btn{
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:4px;
    border:1px solid var(--garnet);
    background:var(--garnet);
    color:var(--garnet-ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{opacity:0.9}
  .btn:focus-visible{outline:2px solid var(--garnet);outline-offset:2px}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line-strong)}
  .btn.secondary:hover{border-color:var(--garnet);color:var(--garnet)}
  .admin-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
  .admin-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  .admin-table th{
    text-align:left;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
    padding:8px 10px;
    background:var(--surface-2);
    border-bottom:1px solid var(--line-strong);
    white-space:nowrap;
  }
  .admin-table td{
    padding:8px 10px;
    border-bottom:1px solid var(--line);
    white-space:nowrap;
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .admin-table tbody tr{cursor:pointer}
  .admin-table tbody tr:hover{background:var(--surface-2)}
  .admin-pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px;font-size:13px;color:var(--muted)}
  .admin-pager button{
    font-family:var(--sans);
    font-size:12.5px;
    padding:6px 12px;
    border-radius:100px;
    border:1px solid var(--line-strong);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .admin-pager button:disabled{opacity:0.4;cursor:default}
  .admin-pager button:not(:disabled):hover{border-color:var(--garnet);color:var(--garnet)}
  .admin-form{display:flex;flex-direction:column;gap:12px}
  .admin-field{display:flex;flex-direction:column;gap:5px}
  .admin-field label{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .admin-field input,.admin-field select,.admin-field textarea{
    padding:9px 12px;
    font-family:var(--sans);
    font-size:14px;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line-strong);
    border-radius:4px;
    outline:none;
  }
  .admin-field textarea{resize:vertical;min-height:52px;font-family:var(--sans)}
  .admin-field input:focus-visible,.admin-field select:focus-visible,.admin-field textarea:focus-visible{border-color:var(--garnet)}
  .admin-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
  .admin-note{font-size:12.5px;color:var(--muted);line-height:1.5}
  .admin-banner{padding:12px 14px;border-radius:4px;font-size:13px;line-height:1.6;margin-bottom:14px}
  .admin-banner.ok{background:var(--score-hi-bg);color:var(--score-hi)}
  .admin-banner.err{background:var(--score-lo-bg);color:var(--score-lo)}
  .admin-banner.warn{background:var(--score-md-bg);color:var(--score-md)}
  .admin-banner a{color:inherit;font-weight:700}
  .admin-badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:100px}
  @media (max-width:560px){
    .admin-modal{width:96vw}
    .admin-table td{max-width:140px}
  }

  /* ── 사전 신선도 / 알림 ─────────────────────────────────────── */
  /* 오프라인이거나 사전이 낡았을 때만 뜬다. 최신일 땐 아무 말도 하지 않는다. */
  .freshness{
    display:none;
    align-self:flex-start;
    margin-top:6px;
    padding:3px 10px;
    border-radius:100px;
    font-size:11px;
    letter-spacing:0.02em;
    color:var(--score-md);
    background:var(--score-md-bg);
    font-variant-numeric:tabular-nums;
  }
  .freshness.on{display:inline-block}
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    z-index:10;
    padding:11px 18px;
    border-radius:100px;
    font-size:13px;
    color:var(--garnet-ink);
    background:var(--garnet);
    box-shadow:0 6px 24px rgba(0,0,0,0.22);
    animation:toast-in 0.24s ease both;
  }
  @keyframes toast-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  @media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div class="page">
  <header class="masthead">
    <button id="adminGear" class="icon-btn" type="button" aria-label="사전 관리" title="사전 관리">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
        <path d="M19.4 13.5a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V19.5a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H4.5a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 8.54 4.6l.06.06a1.65 1.65 0 0 0 1.82.33h.08A1.65 1.65 0 0 0 11.5 3.5V3.4a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.08a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.08c.26.63.86 1.07 1.51 1.09h.1a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
    </button>
    <p class="eyebrow">Wine Name Dictionary</p>
    <h1>와인명 사전</h1>
    <p class="lede">한글로 입력한 와인 이름을 원어명으로 찾아드립니다. 딸보, 탈보, 타르보 — 다르게 써도 같은 와인을 찾습니다.</p>
    <p class="stat" id="stat"></p>
    <span class="freshness" id="freshness" aria-live="polite"></span>
  </header>

  <section class="search-panel">
    <input id="q" type="text" placeholder="샤또 딸보, 몬테풀치아노, Dom Perignon…" autocomplete="off" spellcheck="false" />
    <div class="controls-row">
      <div class="chips" id="chips" role="group" aria-label="검색 대상">
        <button class="chip on" type="button" data-t="all">전체</button>
        <button class="chip" type="button" data-t="p">생산자</button>
        <button class="chip" type="button" data-t="r">지역</button>
        <button class="chip" type="button" data-t="g">품종</button>
      </div>
      <label class="precision">
        <span class="precision-label">정밀도</span>
        <input id="th" type="range" min="80" max="99" value="85" />
        <span class="precision-value" id="thv">0.85</span>
      </label>
    </div>
  </section>

  <section class="jamo" id="jamo" aria-live="polite">
    <div class="jamo-row"><span class="jamo-label" id="lb0">입력</span><span class="jamo-value" id="j-raw"></span></div>
    <div class="jamo-row"><span class="jamo-label" id="lb1">자모 분해</span><span class="jamo-value mono" id="j-dec"></span></div>
    <div class="jamo-row"><span class="jamo-label" id="lb2">정규화 키</span><span class="jamo-value mono" id="j-key"></span></div>
  </section>

  <section class="results" id="res" aria-live="polite">
    <div class="hint">
      <span>이렇게 검색해보세요.</span>
      <div class="hint-examples" id="hintExamples">
        <button class="hint-chip" type="button">샤또 딸보</button>
        <button class="hint-chip" type="button">디켐</button>
        <button class="hint-chip" type="button">로칠드</button>
        <button class="hint-chip" type="button">몬테풀치아노</button>
        <button class="hint-chip" type="button">d'abruzzo</button>
        <button class="hint-chip" type="button">ㅊ뮫굳ㅅ</button>
      </div>
    </div>
  </section>
</div>

<dialog id="adminModal" class="admin-modal">
  <div class="admin-inner">
    <div class="admin-head">
      <h2 id="adminTitle">사전 관리</h2>
      <button class="icon-btn" id="adminClose" type="button" aria-label="닫기" title="닫기">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="admin-body" id="adminBody"></div>
  </div>
</dialog>

<script type="module" src="/demo/app.js"></script>
<script type="module" src="/demo/admin.js"></script>
